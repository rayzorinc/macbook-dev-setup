name: macOS Homebrew smoke check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-packages:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Resolve declared taps, formulae, and casks
        shell: bash
        run: |
          set -euo pipefail

          taps="$(awk '/^homebrew_taps:/,/^$/' group_vars/all.yml | awk '$1 == "-" {print $2}')"
          formulae="$(awk '/^homebrew_formulae_(core|sre):/,/^$/' group_vars/all.yml | awk '$1 == "-" {print $2}')"
          casks="$(awk '/^homebrew_casks:/,/^$/' group_vars/all.yml | awk '$1 == "-" {print $2}')"

          while IFS= read -r tap; do
            [[ -z "$tap" ]] || brew tap "$tap"
          done <<< "$taps"

          while IFS= read -r formula; do
            [[ -z "$formula" ]] || brew info --formula "$formula"
          done <<< "$formulae"

          while IFS= read -r cask; do
            [[ -z "$cask" ]] || brew info --cask "$cask"
          done <<< "$casks"
